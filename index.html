<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8dedb">
  <meta name="description" content="Arda Öztiryaki — Sosyal medya, yaratıcı fikirler ve metinler. İnteraktif portfolyo masaüstü.">
  <title>Arda Öztiryaki — Yaratıcı masaüstü</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><img src="./assets/arda.webp" alt=""></div>
  <div class="ambient" aria-hidden="true"></div>
  <header class="desktop-heading"><span>ARDA ÖZTİRYAKİ</span><span>Sosyal medya uzmanı & metin yazarı</span></header>
  <main id="desktop" aria-label="Portfolyo masaüstü">
    <div id="desktop-icons" role="group" aria-label="Masaüstü dosyaları" aria-describedby="icon-help"><div id="icon-canvas">
      <button class="desktop-icon" data-open="about"><img class="office-icon" src="./assets/word.svg" alt="" draggable="false" width="48" height="48"><span>Hakkımda.docx</span></button>
      <button class="desktop-icon" data-open="projects"><img class="works-icon" src="./assets/works.svg" alt="" draggable="false" width="45" height="45"><span>Seçilmiş işler</span></button>
      <button class="desktop-icon" data-open="notes"><span class="file-icon note-file">Aa<span>≡</span></span><span>Not defterim.txt</span></button>
      <button class="desktop-icon" data-open="skills"><img class="office-icon" src="./assets/excel.svg" alt="" draggable="false" width="48" height="48"><span>Neler yaparım.xlsx</span></button>
      <button class="desktop-icon" data-open="experience"><span class="folder-icon"></span><span>Önceki tecrübelerim</span></button>
    </div></div>
    <p class="sr-only" id="icon-help">Simgeleri sürükleyerek veya Alt ve yön tuşlarıyla taşıyabilirsiniz. Sağ tık menüsü için Shift ve F10 tuşlarına basın.</p>
    <div id="windows"></div>
  </main>
  <aside id="start-menu" aria-label="Başlat menüsü" hidden>
    <div class="start-top"><span class="avatar">AÖ</span><div><strong>Arda Öztiryaki</strong><small>Yaratıcı masaüstüme hoş geldin.</small></div></div>
    <p>SABİTLENENLER</p>
    <div class="start-apps"><button data-open="about"><img class="office-icon small" src="./assets/word.svg" alt="" width="33" height="33">Hakkımda</button><button data-open="projects"><img class="works-icon small" src="./assets/works.svg" alt="" width="33" height="33">Seçilmiş işler</button><button data-open="experience"><span class="app-tile folder">▰</span>Tecrübelerim</button><button data-open="notes"><span class="app-tile notes">≡</span>Notlar</button><button data-open="skills"><img class="office-icon small" src="./assets/excel.svg" alt="" width="33" height="33">Yetenekler</button></div>
    <footer><span>Her şey bir fikirle başlar.</span><button id="reset-desktop" aria-label="Masaüstünü sıfırla" title="Masaüstünü sıfırla">↻</button></footer>
  </aside>
  <footer class="taskbar">
    <button id="start-button" aria-label="Başlat" title="Başlat" aria-expanded="false"><span class="windows-logo"><i></i><i></i><i></i><i></i></span></button>
    <nav class="social-links" aria-label="Sosyal bağlantılar">
      <a id="instagram-link" href="https://www.instagram.com/ardaoztiryaki/" aria-label="Instagram" title="Instagram" target="_blank" rel="noopener noreferrer"><span class="instagram-icon small" aria-hidden="true"><i></i></span></a>
      <a href="https://www.linkedin.com/in/ardaoztiryaki/" aria-label="LinkedIn" title="LinkedIn" target="_blank" rel="noopener noreferrer"><span class="linkedin-icon" aria-hidden="true">in</span></a>
      <a href="mailto:ardaoztiryaki@gmail.com" aria-label="E-posta gönder" title="ardaoztiryaki@gmail.com"><svg class="mail-icon" viewBox="0 0 32 28" fill="none" aria-hidden="true"><rect x="1" y="3" width="30" height="23" rx="4" fill="#5899be"/><path d="m3 6 13 10L29 6" stroke="white" stroke-width="1.6"/><path d="m3 23 9-8m17 8-9-8" stroke="#fff" stroke-opacity=".55" stroke-width="1.3"/></svg></a>
    </nav>
    <div class="taskbar-system"><div class="tray"><span class="tray-language">TR</span><div><time id="clock"></time><time id="date"></time></div><button id="show-desktop" aria-label="Masaüstünü göster" title="Masaüstünü göster"></button></div></div>
  </footer>
  <div id="context-menu" class="context-menu" role="menu" aria-label="Masaüstü menüsü" hidden></div>
  <div id="desktop-announcement" class="sr-only" aria-live="polite"></div>
  <noscript><div class="no-script">Bu interaktif portfolyoyu gezmek için JavaScript’i etkinleştirin. Arda Öztiryaki — Sosyal medya uzmanı & metin yazarı.</div></noscript>
</body>
</html>
