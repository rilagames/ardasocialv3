<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8dedb">
  <meta name="description" content="Arda Öztiryaki — Sosyal medya, yaratıcı fikirler ve metinler. İnteraktif portfolyo masaüstü.">
  <title>Arda Öztiryaki — Yaratıcı masaüstü</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><img src="./assets/arda.webp" alt=""></div>
  <div class="ambient" aria-hidden="true"></div>
  <header class="desktop-heading"><span>ARDA ÖZTİRYAKİ</span><span>Sosyal medya uzmanı & metin yazarı</span></header>
  <main id="desktop" aria-label="Portfolyo masaüstü">
    <div id="desktop-icons" role="group" aria-label="Masaüstü dosyaları" aria-describedby="icon-help"><div id="icon-canvas">
      <button class="desktop-icon" data-open="about"><span class="file-icon word-file">W<span>≡</span></span><span>Hakkımda.docx</span></button>
      <button class="desktop-icon" data-open="projects"><span class="instagram-icon" aria-hidden="true"><i></i></span><span>Seçilmiş işler</span></button>
      <button class="desktop-icon" data-open="notes"><span class="file-icon note-file">Aa<span>≡</span></span><span>Not defterim.txt</span></button>
      <button class="desktop-icon" data-open="skills"><span class="file-icon excel-file">X<span>▦</span></span><span>Neler yaparım.xlsx</span></button>
      <button class="desktop-icon" data-open="experience"><span class="folder-icon"></span><span>Önceki tecrübelerim</span></button>
    </div></div>
    <p class="sr-only" id="icon-help">Simgeleri sürükleyerek veya Alt ve yön tuşlarıyla taşıyabilirsiniz. Sağ tık menüsü için Shift ve F10 tuşlarına basın.</p>
    <div id="windows"></div>
  </main>
  <aside id="start-menu" aria-label="Başlat menüsü" hidden>
    <div class="start-top"><span class="avatar">AÖ</span><div><strong>Arda Öztiryaki</strong><small>Yaratıcı masaüstüme hoş geldin.</small></div></div>
    <p>SABİTLENENLER</p>
    <div class="start-apps"><button data-open="about"><span class="app-tile word">W</span>Hakkımda</button><button data-open="projects"><span class="instagram-icon small" aria-hidden="true"><i></i></span>Seçilmiş işler</button><button data-open="experience"><span class="app-tile folder">▰</span>Tecrübelerim</button><button data-open="notes"><span class="app-tile notes">≡</span>Notlar</button><button data-open="skills"><span class="app-tile excel">X</span>Yetenekler</button></div>
    <footer><span>Her şey bir fikirle başlar.</span><button id="reset-desktop" aria-label="Masaüstünü sıfırla" title="Masaüstünü sıfırla">↻</button></footer>
  </aside>
  <footer class="taskbar">
    <nav aria-label="Görev çubuğu"><button id="start-button" aria-label="Başlat" aria-expanded="false"><span class="windows-logo"><i></i><i></i><i></i><i></i></span></button><button data-open="projects" aria-label="Seçilmiş işler"><span class="instagram-icon small" aria-hidden="true"><i></i></span></button><button data-open="about" aria-label="Hakkımda belgesi"><span class="app-tile word">W</span></button><button data-open="experience" aria-label="Önceki tecrübelerim"><span class="task-folder">▰</span></button><button data-open="notes" aria-label="Not defteri"><span class="app-tile notes">≡</span></button><span class="task-separator"></span><button data-open="skills" aria-label="Yetenekler"><span class="app-tile excel">X</span></button></nav>
    <div class="tray"><span class="tray-language">TR</span><div><time id="clock"></time><time id="date"></time></div><button id="show-desktop" aria-label="Masaüstünü göster" title="Masaüstünü göster"></button></div>
  </footer>
  <div id="context-menu" class="context-menu" role="menu" aria-label="Masaüstü menüsü" hidden></div>
  <div id="desktop-announcement" class="sr-only" aria-live="polite"></div>
  <noscript><div class="no-script">Bu interaktif portfolyoyu gezmek için JavaScript’i etkinleştirin. Arda Öztiryaki — Sosyal medya uzmanı & metin yazarı.</div></noscript>
</body>
</html>
